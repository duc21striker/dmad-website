<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BOX LAGOS — Restaurant · Lounge · Grills · Car Wash</title>
  <meta name="description" content="Lagos' premier multi-experience venue. Restaurant, lounge, grills, and car wash under one roof.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="THE BOX LAGOS — Restaurant · Lounge · Grills · Car Wash">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       THE BOX LAGOS — Menu-wall aesthetic
       Palette anchored to logo: black + white + amber
       Designed & developed by DMAD
       ============================================================ */

    /* ---------- 01. TOKENS ---------- */
    :root {
      --black: #000000;
      --black-2: #0A0A0A;
      --black-3: #141414;
      --ink: #050505;

      --grey-1: #E8E8E8;
      --grey-2: #F0F0F0;
      --grey-3: #F7F7F7;
      --grey-border: #E5E5E5;

      --amber: #FF6B1A;
      --amber-2: #E85A0E;

      --white: #FFFFFF;
      --cream: #FBF8F2;

      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Manrope', system-ui, sans-serif;

      --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
      --ease-out-soft: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ---------- 02. RESET ---------- */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--white);
      color: var(--black);
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1.25rem; }
    @media (min-width: 768px) { .container { padding: 0 2.5rem; } }

    /* ---------- 03. TYPOGRAPHY ---------- */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    h1 { font-size: clamp(3rem, 9vw, 7.5rem); }
    h2 { font-size: clamp(2.5rem, 6vw, 5rem); }
    h3 { font-size: clamp(1.5rem, 2.5vw, 2.25rem); }

    .kicker {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1rem;
    }

    /* ---------- 04. BUTTONS ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
      padding: 1rem 1.75rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 100px;
      transition: all 0.3s var(--ease-out-soft);
      white-space: nowrap;
      cursor: pointer;
      border: 1.5px solid transparent;
    }
    .btn--black { background: var(--black); color: var(--white); }
    .btn--black:hover { background: var(--black-3); transform: translateY(-2px); box-shadow: 0 15px 35px -12px rgba(0,0,0,0.4); }
    .btn--amber { background: var(--amber); color: #fff; }
    .btn--amber:hover { background: var(--amber-2); transform: translateY(-2px); box-shadow: 0 15px 35px -10px rgba(255,107,26,0.5); }
    .btn--outline { border-color: var(--black); color: var(--black); }
    .btn--outline:hover { background: var(--black); color: var(--white); }
    .btn__arrow { display: inline-block; transition: transform 0.3s var(--ease-out-soft); }
    .btn:hover .btn__arrow { transform: translateX(3px); }

    /* ---------- 05. NAV ---------- */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 1rem 0;
      transition: all 0.35s var(--ease-out-soft);
    }
    .nav.scrolled {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
    }
    .nav__inner { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
    .nav__logo { display: inline-flex; align-items: center; line-height: 1; }
    .nav__logo img { height: 32px; width: auto; display: block; }
    .nav__links { display: none; gap: 2rem; align-items: center; }
    @media (min-width: 900px) { .nav__links { display: flex; } }
    .nav__link {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--black);
      opacity: 0.7;
      transition: opacity 0.25s;
    }
    .nav__link:hover { opacity: 1; }
    .nav__cta { display: none; }
    @media (min-width: 900px) { .nav__cta { display: inline-flex; } }
    .nav__toggle { display: flex; flex-direction: column; gap: 5px; padding: 8px; }
    @media (min-width: 900px) { .nav__toggle { display: none; } }
    .nav__toggle span { display: block; width: 24px; height: 2px; background: var(--black); transition: all 0.3s; }
    .nav__toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav__toggle.open span:nth-child(2) { opacity: 0; }
    .nav__toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav__mobile {
      position: fixed; inset: 0;
      background: var(--white);
      z-index: 999;
      padding: 6rem 2rem 2rem;
      transform: translateX(100%);
      transition: transform 0.5s var(--ease-out-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .nav__mobile.open { transform: translateX(0); }
    .nav__mobile ul { list-style: none; display: flex; flex-direction: column; gap: 1.5rem; text-align: center; }
    .nav__mobile a {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--black);
      transition: color 0.25s;
    }
    .nav__mobile a:hover { color: var(--amber); }

    /* ---------- 06. HERO ---------- */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--black);
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 7rem 0 3rem;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -10%;
      width: 70%;
      height: 90%;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.06), transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 15% 85%, rgba(255, 107, 26, 0.15), transparent 45%);
      pointer-events: none;
    }

    .hero__inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }
    @media (min-width: 1000px) {
      .hero__inner { grid-template-columns: 1.1fr 1fr; gap: 4rem; padding: 0 2.5rem; }
    }

    .hero__text { color: var(--white); }
    .hero__logo {
      height: 52px;
      width: auto;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.7s var(--ease-out-soft) 0.2s forwards;
    }
    @media (min-width: 768px) { .hero__logo { height: 64px; } }

    .hero__kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--grey-1);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.7s var(--ease-out-soft) 0.3s forwards;
    }
    .hero__kicker .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--white);
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease-out-soft) 0.5s forwards;
    }
    .hero__title em {
      display: block;
      font-style: normal;
      color: var(--amber);
      font-weight: 900;
    }

    .hero__sub {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.65;
      max-width: 44ch;
      margin-bottom: 2.25rem;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out-soft) 0.7s forwards;
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out-soft) 0.9s forwards;
    }
    .hero__actions .btn--outline { border-color: rgba(255,255,255,0.35); color: var(--white); }
    .hero__actions .btn--outline:hover { background: var(--white); color: var(--black); border-color: var(--white); }

    .hero__visual {
      position: relative;
      opacity: 0;
      animation: fadeUp 1s var(--ease-out-soft) 0.6s forwards;
      aspect-ratio: 4/5;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }
    @media (max-width: 999px) { .hero__visual { max-width: 380px; } }

    .hero__card {
      position: absolute;
      inset: 0;
      border-radius: 32px 32px 32px 96px;
      overflow: hidden;
      background: var(--black-3);
      box-shadow: 0 40px 80px -30px rgba(0,0,0,0.8);
    }
    .hero__card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.03);
    }
    .hero__card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.7) 100%);
    }

    .hero__badge {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 2;
    }
    .hero__badge-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--amber);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .hero__badge-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
      opacity: 0.5;
      margin-bottom: 0.15rem;
    }
    .hero__badge-value {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--black);
      letter-spacing: -0.01em;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .hero__logo, .hero__kicker, .hero__title, .hero__sub, .hero__actions, .hero__visual {
      transform: translateY(30px);
    }

    /* ---------- 07. SERVICES STRIP ---------- */
    .services {
      background: var(--amber);
      padding: 2rem 0;
      overflow: hidden;
    }
    .services__inner {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    @media (min-width: 768px) {
      .services__inner {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 3rem;
      }
    }
    .services__item {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--white);
      text-transform: uppercase;
      white-space: nowrap;
      justify-content: center;
    }
    @media (min-width: 768px) { .services__item { font-size: 1.75rem; } }
    .services__item::after {
      content: '·';
      color: var(--white);
      opacity: 0.4;
    }
    .services__item:last-child::after { display: none; }

    /* ---------- 08. SECTION BASE ---------- */
    section { padding: 5rem 0; }
    @media (min-width: 1024px) { section { padding: 7rem 0; } }

    .section-head { max-width: 780px; margin-bottom: 3rem; }
    .section-head h2 { margin-bottom: 1.25rem; color: var(--black); }
    .section-head h2 em { font-style: normal; color: var(--amber); }

    /* ---------- 09. THE FOUR ---------- */
    .four { background: var(--white); }
    .four__list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--grey-border);
    }
    .four__row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--grey-border);
      align-items: center;
      transition: all 0.3s var(--ease-out-soft);
      cursor: pointer;
    }
    @media (min-width: 768px) {
      .four__row { grid-template-columns: 100px 1fr 2fr auto; gap: 2rem; padding: 2.5rem 0; }
    }
    .four__row:hover {
      padding-left: 1rem;
      padding-right: 1rem;
      background: var(--grey-3);
    }
    .four__num {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--amber);
      letter-spacing: -0.02em;
    }
    .four__title {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 3.5vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--black);
    }
    .four__desc {
      font-size: 0.95rem;
      color: var(--black);
      opacity: 0.7;
      line-height: 1.6;
      max-width: 48ch;
    }
    .four__arrow {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--black);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s var(--ease-out-soft);
      flex-shrink: 0;
      margin-left: auto;
    }
    .four__row:hover .four__arrow {
      background: var(--black);
      color: var(--white);
      transform: translateX(4px);
    }

    /* ---------- 10. MENU WALL ---------- */
    .menu-wall {
      background: var(--black);
      padding: 6rem 0;
      position: relative;
      overflow: hidden;
    }
    .menu-wall::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; height: 500px;
      background: radial-gradient(ellipse 50% 60% at center, rgba(255, 255, 255, 0.04), transparent 70%);
      pointer-events: none;
    }
    .menu-wall .section-head h2 { color: var(--white); }
    .menu-wall .section-head h2 em { color: var(--amber); }

    .menu-wall__grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      position: relative;
      z-index: 1;
    }
    @media (min-width: 700px) { .menu-wall__grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .menu-wall__grid { grid-template-columns: repeat(3, 1fr); } }

    .menu-card {
      background: var(--grey-3);
      border-radius: 20px;
      padding: 1.75rem 1.5rem 1.5rem;
      transition: all 0.35s var(--ease-out-soft);
      display: flex;
      flex-direction: column;
      min-height: 320px;
    }
    .menu-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 60px -25px rgba(0,0,0,0.5);
      background: var(--white);
    }
    .menu-card__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1.5px solid rgba(0, 0, 0, 0.12);
    }
    .menu-card__title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--black);
      text-transform: uppercase;
    }
    .menu-card__num {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--black);
      opacity: 0.4;
    }
    .menu-card__items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }
    .menu-card__item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.85rem;
      line-height: 1.35;
      color: var(--black);
    }
    .menu-card__item-name { flex: 1; font-weight: 500; }
    .menu-card__item-price {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--black);
      background: var(--grey-1);
      padding: 0.2rem 0.65rem;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .menu-card:hover .menu-card__item-price {
      background: var(--amber);
      color: #fff;
    }

    /* ---------- 11. COLLAGE ---------- */
    .collage { background: var(--white); padding: 6rem 0; }
    .collage__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    @media (min-width: 700px) { .collage__grid { gap: 1rem; } }
    .collage__tile {
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      background: var(--black);
      position: relative;
    }
    .collage__tile img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.7s var(--ease-out-soft);
    }
    .collage__tile:hover img { transform: scale(1.08); }
    .collage__tile--text {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
    }
    .collage__tile--text span {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--white);
      line-height: 0.95;
      text-transform: uppercase;
    }
    .collage__tile--amber { background: var(--amber); }
    .collage__tile--amber span { color: var(--white); }

    /* ---------- 12. DRINKS ---------- */
    .drinks {
      background: var(--black);
      padding: 5rem 0;
      overflow: hidden;
    }
    .drinks__head { margin-bottom: 2.5rem; }
    .drinks__head h2 { color: var(--white); }
    .drinks__head h2 em { font-style: normal; color: var(--amber); }
    .drinks__scroller {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1.5rem;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .drinks__scroller::-webkit-scrollbar { display: none; }
    .drink-card {
      flex: 0 0 220px;
      scroll-snap-align: start;
      background: var(--grey-3);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 200px;
    }
    .drink-card__cat {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
    }
    .drink-card__name {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
